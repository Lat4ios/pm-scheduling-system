services:
  - type: web
    name: pm-scheduling-system
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PM_DATA_DIR
        value: /var/data
      - key: PM_TIMEZONE
        value: Asia/Kolkata
      - key: PM_ADMIN_INITIAL_PASSWORD
        sync: false
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_ENCRYPTION
        value: tls
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        value: PM Scheduling System
    disk:
      name: pm-schedule-data
      mountPath: /var/data
      sizeGB: 1
